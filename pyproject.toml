[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delaybudget"
dynamic = ["version"]
description = "Provably minimal notification batching under individual delay budgets"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tomàs Ortega" }]
maintainers = [{ name = "Tomàs Ortega" }]
keywords = ["batching", "notifications", "scheduling", "optimization", "privacy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TomasOrtega/DelayBudget"
Repository = "https://github.com/TomasOrtega/DelayBudget.git"
Issues = "https://github.com/TomasOrtega/DelayBudget/issues"
Changelog = "https://github.com/TomasOrtega/DelayBudget/blob/main/CHANGELOG.md"

[project.scripts]
delaybudget = "delaybudget.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.15,<3",
  "ruff>=0.11,<1",
  "twine>=6.1,<7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "delaybudget._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delaybudget = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["delaybudget"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["delaybudget"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
