name: Bug report
description: Report a reproducible correctness or usability problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DelayBudget. Do not include sensitive notification content.
  - type: input
    id: version
    attributes:
      label: DelayBudget version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input trace
      description: Use synthetic identifiers and JSON Lines where possible.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and invocation.
