name: Feature request
description: Propose a focused improvement to the portable scheduler or CLI
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        DelayBudget intentionally keeps platform integrations outside this
        repository. Explain why the proposal belongs in the portable core.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include exact semantics, examples, or an API sketch.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
