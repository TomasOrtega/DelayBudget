version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      development-tools:
        patterns:
          - "coverage"
          - "mypy"
          - "prek"
          - "ruff"
          - "twine"
