name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          version: "0.11.31"
          enable-cache: true
      - name: Sync development environment
        run: uv sync --locked
      - name: Verify tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(uv run --locked --no-sync python -c 'import runpy; print(runpy.run_path("src/delaybudget/_version.py")["__version__"])')"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Run release checks
        run: |
          uv run --locked --no-sync coverage run -m unittest discover -s tests -v
          uv run --locked --no-sync coverage report
          uv run --locked --no-sync prek -a --quiet
          uv run --locked --no-sync mypy
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --locked --no-sync twine check dist/*
      - name: Test wheel
        run: |
          test "$(uv run --isolated --no-project --python 3.14 --with dist/*.whl delaybudget --version)" = "delaybudget ${PACKAGE_VERSION}"
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "dist/*"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delaybudget-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "DelayBudget ${PACKAGE_VERSION}"
          fi
