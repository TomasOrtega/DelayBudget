name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.11.31"
          enable-cache: true
      - name: Sync package
        run: uv sync --locked --no-dev
      - name: Run tests
        run: uv run --locked --no-sync python -m unittest discover -s tests -v
      - name: Compile package
        run: uv run --locked --no-sync python -m compileall -q src
      - name: Smoke-test CLI
        run: uv run --locked --no-sync delaybudget --version

  quality:
    name: Quality and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          version: "0.11.31"
          enable-cache: true
      - name: Sync development environment
        run: uv sync --locked
      - name: Run tests with branch coverage
        run: |
          uv run --locked --no-sync coverage run -m unittest discover -s tests -v
          uv run --locked --no-sync coverage report
      - name: Run prek hooks
        run: uv run --locked --no-sync prek -a --quiet
      - name: Type-check
        run: uv run --locked --no-sync mypy
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --locked --no-sync twine check dist/*
      - name: Test wheel in a clean environment
        run: |
          uv run --isolated --no-project --python 3.14 --with dist/*.whl delaybudget --version
          uv run --isolated --no-project --python 3.14 --with dist/*.whl \
            python -c "from delaybudget import OnlineScheduler; assert OnlineScheduler().next_deadline is None"
